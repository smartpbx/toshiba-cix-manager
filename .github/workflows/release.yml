name: Build release artifacts

# Builds the self-contained Windows .exe and Linux AppImage. On a version tag
# (v*) they are attached to the GitHub Release; on manual dispatch they are
# uploaded as workflow artifacts for testing. Built binaries are never committed
# to git — they live only in Releases / workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller (build-time only)
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build the .exe
        run: python packaging/build_windows.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toshiba-CIX-Manager-windows
          path: dist/Toshiba CIX Manager.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Toshiba CIX Manager.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the AppImage
        run: bash packaging/build_appimage.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toshiba-CIX-Manager-linux
          path: dist/Toshiba_CIX_Manager-x86_64.AppImage
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Toshiba_CIX_Manager-x86_64.AppImage
